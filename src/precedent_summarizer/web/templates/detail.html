{% extends "base.html" %}{% block title %}판례 상세 · 판례 연구실{% endblock %}{% block content %}
<div id="detail-page" data-prec-id="{{ prec_id }}"><a href="/" id="back-link" class="back-link">← 판례 목록</a><section class="case-heading"><p class="eyebrow">CASE RECORD · 판례 상세</p><div class="case-heading-top"><p id="case-number" class="case-number"></p></div><div class="case-title-row"><h1 id="case-title">판례를 불러오는 중입니다.</h1><span id="case-disposition" aria-live="polite"></span></div><dl id="case-meta" class="case-meta"></dl><p id="detail-error" class="error" role="alert" hidden></p></section>
<div class="reading-grid"><section id="summary-panel" class="paper" aria-labelledby="summary-title"><div class="panel-heading"><h2 id="summary-title"><small>HOLDING</small>판결 요약</h2><span class="muted small">근거를 눌러 원문 확인</span></div><div id="summary-tabs" class="tabs" role="tablist" aria-label="요약 버전"></div><div id="summary-content" role="tabpanel" aria-live="polite"><p class="muted">요약을 확인하는 중입니다.</p></div></section>
<section id="original-panel" class="paper" aria-labelledby="original-title"><div class="panel-heading"><h2 id="original-title"><small>ORIGINAL RECORD</small>판결 원문</h2><button id="clear-highlight" type="button">강조 해제</button></div><nav id="section-nav" class="section-nav" aria-label="원문 구획 목차"></nav><p id="evidence-status" role="status" aria-live="polite" class="small muted">원문의 문장과 요약 근거를 함께 확인하세요.</p><div class="original-layout"><div id="original-text" class="original-text" tabindex="0"></div><nav id="evidence-minimap" class="evidence-minimap" aria-label="원문 근거 미니맵"></nav></div></section></div>
<section id="court-materials" class="court-materials" aria-label="법원 작성 원문"><h2><small>COURT MATERIALS</small>법원 작성 원문</h2></section></div>{% endblock %}
